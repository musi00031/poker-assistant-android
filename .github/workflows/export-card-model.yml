name: Export Playing Card Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics onnx

      - name: Download trained card detector
        run: |
          git clone --depth 1 \
            https://github.com/xay6/playing-card-detector.git \
            /tmp/playing-card-detector

          test -s /tmp/playing-card-detector/runs_cards/cards_detector4/weights/best.pt

      - name: Export trained detector to ONNX
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO

          weights = Path(
              "/tmp/playing-card-detector/"
              "runs_cards/cards_detector4/weights/best.pt"
          )

          model = YOLO(str(weights))
          print("Model classes:", model.names)
          print("Number of classes:", len(model.names))

          if len(model.names) != 52:
              raise RuntimeError(
                  f"Expected 52 playing-card classes, got {len(model.names)}"
              )

          output = model.export(
              format="onnx",
              imgsz=640,
              opset=12,
              dynamic=False,
              simplify=False,
              nms=False,
              device="cpu"
          )

          output = Path(output)
          if not output.is_file() or output.stat().st_size == 0:
              raise RuntimeError("ONNX export did not produce a valid file")

          print("Exported model:", output)
          print("Model size:", output.stat().st_size, "bytes")
          PY

      - name: Validate ONNX model
        run: |
          python - <<'PY'
          import onnx

          path = (
              "/tmp/playing-card-detector/"
              "runs_cards/cards_detector4/weights/best.onnx"
          )

          model = onnx.load(path)
          onnx.checker.check_model(model)

          print("ONNX validation successful")
          print("Inputs:", [x.name for x in model.graph.input])
          print("Outputs:", [x.name for x in model.graph.output])
          PY

      - name: Upload ONNX model
        uses: actions/upload-artifact@v4
        with:
          name: playing-card-detector-onnx
          path: /tmp/playing-card-detector/runs_cards/cards_detector4/weights/best.onnx
          if-no-files-found: error
          retention-days: 14
